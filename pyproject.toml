[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tech-consultant"
version = "0.1.0"
description = "AI Tech Consultant Capstone"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pgvector",
    "procrastinate[psycopg]",
    "jinja2",
    "httpx",
    "pydantic-settings",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "features*", "feature_*"]
